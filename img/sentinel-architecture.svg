<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Sentinel Edge architecture" font-family="Helvetica, Arial, sans-serif"><title>Sentinel Edge architecture</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f2933"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b42318"/></marker></defs><rect width="900" height="420" fill="#fff"/><rect x="20" y="14" width="860" height="176" rx="8" fill="#f6f8fa" stroke="#9aa5b1" stroke-dasharray="5 4"/><text x="32" y="32" font-size="11.5" font-weight="600" fill="#52606d" text-anchor="start">Raspberry Pi (edge)</text><rect x="50" y="54" width="160" height="52" rx="6" fill="#fff" stroke="#52606d" stroke-width="1.2"/><text x="130.0" y="77.0" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle">Voice input</text><text x="130.0" y="93.0" font-size="10.5" fill="#52606d" text-anchor="middle">Vosk, offline</text><rect x="50" y="120" width="160" height="52" rx="6" fill="#fff" stroke="#52606d" stroke-width="1.2"/><text x="130.0" y="143.0" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle">Gesture input</text><text x="130.0" y="159.0" font-size="10.5" fill="#52606d" text-anchor="middle">MediaPipe, camera</text><rect x="310" y="76" width="200" height="66" rx="6" fill="#e8f1f8" stroke="#52606d" stroke-width="1.2"/><text x="410.0" y="106.0" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle">Dispatcher</text><text x="410.0" y="122.0" font-size="10.5" fill="#52606d" text-anchor="middle">token router + Guardian FSM</text><line x1="210" y1="80" x2="310" y2="98" stroke="#1f2933" stroke-width="1.4" marker-end="url(#a)"/><line x1="210" y1="146" x2="310" y2="122" stroke="#1f2933" stroke-width="1.4" marker-end="url(#a)"/><text x="262" y="70" font-size="10.5" font-weight="400" fill="#52606d" text-anchor="middle" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">same tokens</text><text x="580" y="70" font-size="10.5" font-weight="400" fill="#52606d" text-anchor="start" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">Modes: HOME, AWAY, SLEEP, GUEST,</text><text x="580" y="85" font-size="10.5" font-weight="400" fill="#52606d" text-anchor="start" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">ALERT, EMERGENCY</text><text x="580" y="112" font-size="10.5" font-weight="400" fill="#52606d" text-anchor="start" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">A gas alert starts a countdown to</text><text x="580" y="127" font-size="10.5" font-weight="400" fill="#52606d" text-anchor="start" stroke="#fff" stroke-width="3" paint-order="stroke" stroke-linejoin="round">EMERGENCY; the user can cancel it</text><rect x="310" y="228" width="200" height="56" rx="6" fill="#e8f1f8" stroke="#52606d" stroke-width="1.2"/><text x="410.0" y="253.0" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle">MQTT broker</text><text x="410.0" y="269.0" font-size="10.5" fill="#52606d" text-anchor="middle">local, or cloud with TLS</text><line x1="410" y1="142" x2="410" y2="228" stroke="#1f2933" stroke-width="1.4" marker-end="url(#a)"/><rect x="600" y="228" width="250" height="56" rx="6" fill="#fff" stroke="#52606d" stroke-width="1.2"/><text x="725.0" y="253.0" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle">Dashboard and Telegram agent</text><text x="725.0" y="269.0" font-size="10.5" fill="#52606d" text-anchor="middle">live state, alerts, commands</text><line x1="600" y1="256" x2="510" y2="256" stroke="#1f2933" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/><rect x="20" y="316" width="860" height="90" rx="8" fill="#f6f8fa" stroke="#9aa5b1" stroke-dasharray="5 4"/><text x="868" y="334" font-size="11.5" font-weight="600" fill="#52606d" text-anchor="end">NodeMCU (ESP8266) nodes</text><rect x="120" y="352" width="170" height="44" rx="6" fill="#fff" stroke="#52606d" stroke-width="1.2"/><text x="205.0" y="378.5" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle">Door relay</text><rect x="325" y="352" width="170" height="44" rx="6" fill="#fff" stroke="#52606d" stroke-width="1.2"/><text x="410.0" y="378.5" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle">Fan relay</text><rect x="530" y="352" width="200" height="44" rx="6" fill="#fff" stroke="#52606d" stroke-width="1.2"/><text x="630.0" y="371.0" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle">Gas sensor</text><text x="630.0" y="387.0" font-size="10.5" fill="#52606d" text-anchor="middle">triggers the fan automatically</text><line x1="380" y1="284" x2="205" y2="352" stroke="#1f2933" stroke-width="1.4" marker-end="url(#a)"/><line x1="410" y1="284" x2="410" y2="352" stroke="#1f2933" stroke-width="1.4" marker-end="url(#a)"/><line x1="440" y1="284" x2="630" y2="352" stroke="#1f2933" stroke-width="1.4" marker-end="url(#a)"/></svg>